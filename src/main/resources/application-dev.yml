server:
  port: 8080
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/2512A?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: toor
    # Druid连接池参数
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲
      min-idle: 5
      # 最大活跃
      max-active: 20
      # 获取连接等待超时时间
      max-wait: 60000
      # 空闲连接检测
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      # 检测SQL
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 缓存preparedStatement，开启后性能提升
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控过滤器
      filters: stat,wall,log4j2
      # 监控面板账号密码
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456
        allow: 127.0.0.1
      # SQL防火墙
      wall-filter:
        enabled: true
        config:
          multi-statement-allow: false
  data:
    redis:
      # 地址
      host: 127.0.0.1
      # 端口
      port: 6379
      # 密码，无密码注释掉
      password:
      # 数据库索引 默认db0
      database: 0
      # 连接超时时间
      timeout: 3000ms
      # Lettuce 连接池配置
      lettuce:
        pool:
          # 最大活跃连接
          max-active: 20
          # 最大空闲
          max-idle: 10
          # 最小空闲
          min-idle: 5
          # 等待获取连接最大时间
          max-wait: 1000ms
